<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTracker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --accent: #f0a500;
      --text: #e8e8e8;
      --muted: #666;
      --danger: #e74c3c;
      --green: #27ae60;
      --soon: #e67e22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
    header .sub { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
    .stats { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); display: flex; gap: 16px; }
    .stats span { color: var(--accent); }

    /* ALERT BANNER */
    .banner { display: none; padding: 12px 24px; font-size: 14px; font-weight: 500; cursor: pointer; align-items: center; gap: 10px; }
    .banner.overdue { background: var(--danger); color: white; display: flex; }
    .banner.soon { background: var(--soon); color: white; display: flex; }

    main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }

    /* ADD FORM */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 20px;
      margin-bottom: 28px;
    }
    .add-form h2 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
    input[type="text"], input[type="date"], textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }
    .form-row { display: flex; gap: 10px; align-items: flex-end; }
    .form-row .field { flex: 1; margin-bottom: 0; }

    /* BUTTONS */
    button { cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; border: none; padding: 10px 20px; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; }
    .btn-primary:hover { background: #ffbb20; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* FILTERS */
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { background: var(--surface); color: var(--muted); border: 1px solid var(--border); padding: 6px 14px; font-size: 11px; }
    .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* JOB CARDS */
    .jobs-list { display: flex; flex-direction: column; gap: 8px; }
    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      padding: 16px;
      transition: border-color 0.2s, opacity 0.3s;
    }
    .job-card.overdue { border-left-color: var(--danger); }
    .job-card.soon { border-left-color: var(--soon); }
    .job-card.ok { border-left-color: var(--green); }
    .job-card.done { opacity: 0.35; border-left-color: var(--border); }

    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .job-check {
      width: 22px; height: 22px; border: 2px solid var(--border); background: var(--bg);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px; transition: all 0.15s;
    }
    .job-check:hover { border-color: var(--accent); }
    .job-check.checked { background: var(--green); border-color: var(--green); }
    .job-check svg { display: none; }
    .job-check.checked svg { display: block; }

    .job-info { flex: 1; }
    .job-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .job-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
    .job-card.done .job-title { text-decoration: line-through; }

    .job-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .job-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
    .badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; font-weight: 600; }
    .badge.overdue { background: var(--danger); color: white; }
    .badge.soon { background: var(--soon); color: white; }
    .badge.ok { color: var(--green); border: 1px solid var(--green); }
    .badge.done { color: var(--muted); border: 1px solid var(--border); }

    .job-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-icon { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
    .btn-icon:hover { color: var(--text); border-color: var(--muted); }
    .btn-icon.del:hover { color: var(--danger); border-color: var(--danger); }

    /* LAATSTE NOTITIE */
    .job-note { margin-top: 8px; padding: 8px 10px; background: var(--bg); border-left: 2px solid var(--accent); font-size: 12px; color: var(--muted); font-style: italic; }

    /* MODAL */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
    .overlay.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); padding: 28px; width: 100%; max-width: 480px; margin: 16px; }
    .modal h3 { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
    .modal .job-title-ref { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .modal .job-desc-ref { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .modal-actions button { flex: 1; min-width: 120px; }

    .empty { text-align: center; padding: 48px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

    @media (max-width: 600px) {
      .form-row { flex-direction: column; }
      .card-top { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>JobTracker</h1>
    <div class="sub">Werkvoorbereiding & bestellingen</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="banner" id="banner" onclick="scrollToFirst()"></div>

<main>
  <div class="add-form">
    <h2>Nieuwe job toevoegen</h2>
    <div class="field">
      <label>Titel</label>
      <input type="text" id="inputTitle" placeholder="Bijv: Lagers pomp unit 3">
    </div>
    <div class="field">
      <label>Omschrijving</label>
      <textarea id="inputDesc" placeholder="Bijv: Besteld bij Fabrikant X, ordernummer 12345, levertijd 2 weken"></textarea>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Reminder datum</label>
        <input type="date" id="inputDate">
      </div>
      <button class="btn-primary" onclick="addJob()" style="height:42px;white-space:nowrap">Toevoegen</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('open')" data-filter="open">Open</button>
    <button class="filter-btn" onclick="setFilter('all')" data-filter="all">Alles</button>
    <button class="filter-btn" onclick="setFilter('done')" data-filter="done">Afgerond</button>
  </div>

  <div class="jobs-list" id="jobsList"></div>
</main>

<!-- UPDATE MODAL -->
<div class="overlay" id="updateOverlay">
  <div class="modal">
    <h3>Status bijwerken</h3>
    <div class="job-title-ref" id="modalTitle"></div>
    <div class="job-desc-ref" id="modalDesc"></div>
    <div class="field">
      <label>Wat is de status nu?</label>
      <textarea id="modalNote" placeholder="Bijv: Nog niet geleverd, nieuwe beloofde datum is 15 juni" style="min-height:80px"></textarea>
    </div>
    <div class="field">
      <label>Nieuwe reminder datum</label>
      <input type="date" id="modalDate">
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveUpdate()">Opslaan</button>
      <button class="btn-secondary" onclick="markDoneFromModal()">Afvinken als klaar</button>
      <button class="btn-secondary" onclick="closeModal()">Annuleren</button>
    </div>
  </div>
</div>

<script>
  let jobs = [];
  let currentFilter = 'open';
  let activeJobId = null;

  // Set default date to today
  const today = new Date();
  document.getElementById('inputDate').value = today.toISOString().split('T')[0];

  function getStatus(job) {
    if (job.done) return 'done';
    const now = new Date(); now.setHours(0,0,0,0);
    const rem = new Date(job.reminderDate);
    const diff = Math.floor((rem - now) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff <= 2) return 'soon';
    return 'ok';
  }

  function statusLabel(s) {
    return { overdue: 'Verlopen', soon: 'Binnenkort', ok: 'Gepland', done: 'Klaar' }[s];
  }

  function formatDate(d) {
    return new Date(d).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  async function loadJobs() {
    const res = await fetch('/api/jobs');
    jobs = await res.json();
    render();
    updateBanner();
    updateStats();
  }

  function render() {
    const list = document.getElementById('jobsList');
    let filtered = jobs;
    if (currentFilter === 'open') filtered = jobs.filter(j => !j.done);
    if (currentFilter === 'done') filtered = jobs.filter(j => j.done);

    filtered.sort((a, b) => {
      if (a.done && !b.done) return 1;
      if (!a.done && b.done) return -1;
      return new Date(a.reminderDate) - new Date(b.reminderDate);
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">Geen jobs gevonden</div>';
      return;
    }

    list.innerHTML = filtered.map(job => {
      const s = getStatus(job);
      const noteHtml = job.lastNote ? `<div class="job-note">📝 ${esc(job.lastNote)}</div>` : '';
      return `
        <div class="job-card ${s}" id="card-${job.id}">
          <div class="card-top">
            <div class="job-check ${job.done ? 'checked' : ''}" onclick="toggleDone('${job.id}')">
              <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
                <path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="job-info">
              <div class="job-title">${esc(job.title)}</div>
              ${job.description ? `<div class="job-desc">${esc(job.description)}</div>` : ''}
              <div class="job-meta">
                <span class="job-date">${formatDate(job.reminderDate)}</span>
                <span class="badge ${s}">${statusLabel(s)}</span>
              </div>
              ${noteHtml}
            </div>
            <div class="job-actions">
              <button class="btn-icon" onclick="openUpdate('${job.id}')" title="Status bijwerken">↻</button>
              <button class="btn-icon del" onclick="deleteJob('${job.id}')" title="Verwijderen">✕</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function esc(t) {
    if (!t) return '';
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function addJob() {
    const title = document.getElementById('inputTitle').value.trim();
    const desc = document.getElementById('inputDesc').value.trim();
    const date = document.getElementById('inputDate').value;
    if (!title) { alert('Vul een titel in.'); return; }
    if (!date) { alert('Kies een datum.'); return; }
    await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description: desc, reminderDate: date })
    });
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputDesc').value = '';
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    loadJobs();
  }

  async function toggleDone(id) {
    const job = jobs.find(j => j.id === id);
    await fetch(`/api/jobs/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: !job.done })
    });
    loadJobs();
  }

  async function deleteJob(id) {
    if (!confirm('Job verwijderen?')) return;
    await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
    loadJobs();
  }

  function openUpdate(id) {
    const job = jobs.find(j => j.id === id);
    activeJobId = id;
    document.getElementById('modalTitle').textContent = job.title;
    document.getElementById('modalDesc').textContent = job.description || '';
    document.getElementById('modalNote').value = '';
    document.getElementById('modalDate').value = job.reminderDate;
    document.getElementById('updateOverlay').classList.add('show');
    setTimeout(() => document.getElementById('modalNote').focus(), 100);
  }

  function closeModal() {
    document.getElementById('updateOverlay').classList.remove('show');
    activeJobId = null;
  }

  async function saveUpdate() {
    const note = document.getElementById('modalNote').value.trim();
    const date = document.getElementById('modalDate').value;
    if (!date) { alert('Kies een datum.'); return; }
    const body = { reminderDate: date };
    if (note) body.lastNote = note;
    await fetch(`/api/jobs/${activeJobId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    closeModal();
    loadJobs();
  }

  async function markDoneFromModal() {
    await fetch(`/api/jobs/${activeJobId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: true })
    });
    closeModal();
    loadJobs();
  }

  function updateBanner() {
    const overdue = jobs.filter(j => !j.done && getStatus(j) === 'overdue');
    const soon = jobs.filter(j => !j.done && getStatus(j) === 'soon');
    const banner = document.getElementById('banner');
    banner.className = 'banner';
    if (overdue.length) {
      banner.className = 'banner overdue';
      banner.innerHTML = `⚠ ${overdue.length} verlopen reminder${overdue.length > 1 ? 's' : ''} — actie vereist`;
    } else if (soon.length) {
      banner.className = 'banner soon';
      banner.innerHTML = `⏰ ${soon.length} reminder${soon.length > 1 ? 's' : ''} vervalt binnenkort`;
    }
  }

  function scrollToFirst() {
    const el = document.querySelector('.job-card.overdue, .job-card.soon');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function updateStats() {
    const open = jobs.filter(j => !j.done).length;
    const overdue = jobs.filter(j => !j.done && getStatus(j) === 'overdue').length;
    document.getElementById('stats').innerHTML = `
      <div>Open: <span>${open}</span></div>
      <div>Verlopen: <span style="color:${overdue > 0 ? 'var(--danger)' : 'var(--accent)'}">${overdue}</span></div>`;
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    render();
  }

  // Close modal on overlay click
  document.getElementById('updateOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('updateOverlay')) closeModal();
  });

  // Enter to add job
  document.getElementById('inputTitle').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inputDesc').focus(); });

  loadJobs();
</script>
</body>
</html>
