<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTracker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2e2e2e;
      --accent: #f0a500;
      --accent-dim: #a07000;
      --text: #e8e8e8;
      --text-muted: #666;
      --danger: #c0392b;
      --green: #27ae60;
      --overdue: #e74c3c;
      --soon: #e67e22;
      --ok: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    header .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .alert-banner {
      display: none;
      background: var(--danger);
      color: white;
      padding: 12px 24px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
    }

    .alert-banner.show { display: flex; align-items: center; gap: 8px; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 20px;
      margin-bottom: 32px;
    }

    .add-form h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    button {
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      padding: 10px 20px;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .btn-primary:hover { background: #ffbb20; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 11px;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .jobs-list { display: flex; flex-direction: column; gap: 8px; }

    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      padding: 16px;
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      align-items: start;
      transition: border-color 0.2s, opacity 0.3s;
    }

    .job-card.overdue { border-left-color: var(--overdue); }
    .job-card.soon { border-left-color: var(--soon); }
    .job-card.ok { border-left-color: var(--ok); }
    .job-card.done { opacity: 0.4; border-left-color: var(--border); }

    .job-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.15s;
    }

    .job-check:hover { border-color: var(--accent); }
    .job-check.checked { background: var(--green); border-color: var(--green); }

    .job-check svg { display: none; }
    .job-check.checked svg { display: block; }

    .job-body {}

    .job-desc {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .job-card.done .job-desc { text-decoration: line-through; }

    .job-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .job-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      font-weight: 600;
    }

    .badge.overdue { background: var(--overdue); color: white; }
    .badge.soon { background: var(--soon); color: white; }
    .badge.ok { background: transparent; color: var(--ok); border: 1px solid var(--ok); }
    .badge.done { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

    .job-actions { display: flex; gap: 6px; }

    .btn-icon {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-icon:hover { color: var(--text); border-color: var(--text-muted); }
    .btn-icon.del:hover { color: var(--danger); border-color: var(--danger); }

    .snooze-menu {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      z-index: 200;
      display: none;
      flex-direction: column;
    }

    .snooze-menu.show { display: flex; }

    .snooze-option {
      padding: 10px 16px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: none;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Sans', sans-serif;
      letter-spacing: 0;
      text-transform: none;
    }

    .snooze-option:hover { background: var(--border); }

    .empty {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-left: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat span { color: var(--accent); }

    .relative { position: relative; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>JobTracker</h1>
    <div class="subtitle">Werkvoorbereiding &amp; bestellingen</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="alert-banner" id="alertBanner" onclick="scrollToOverdue()">
  ⚠ Je hebt openstaande reminders die aandacht nodig hebben. Klik om te bekijken.
</div>

<main>
  <div class="add-form">
    <h2>Nieuwe job toevoegen</h2>
    <div class="form-row">
      <div class="field" style="grid-column: 1 / -1">
        <label>Omschrijving</label>
        <textarea id="inputDesc" placeholder="Bijv: Lagers besteld voor pomp unit 3, wacht op levering Fabrikant X"></textarea>
      </div>
      <div class="field">
        <label>Reminder datum</label>
        <input type="date" id="inputDate">
      </div>
      <div class="field" style="align-self: end">
        <button class="btn-primary" onclick="addJob()">Toevoegen</button>
      </div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('open')" data-filter="open">Open</button>
    <button class="filter-btn" onclick="setFilter('all')" data-filter="all">Alles</button>
    <button class="filter-btn" onclick="setFilter('done')" data-filter="done">Afgerond</button>
  </div>

  <div class="jobs-list" id="jobsList"></div>
</main>

<div class="snooze-menu" id="snoozeMenu">
  <button class="snooze-option" onclick="snooze(1)">1 dag uitstellen</button>
  <button class="snooze-option" onclick="snooze(3)">3 dagen uitstellen</button>
  <button class="snooze-option" onclick="snooze(7)">1 week uitstellen</button>
  <button class="snooze-option" onclick="snooze(14)">2 weken uitstellen</button>
</div>

<script>
  let jobs = [];
  let currentFilter = 'open';
  let snoozeTargetId = null;

  // Set default date to today
  const today = new Date();
  const dd = String(today.getDate()).padStart(2, '0');
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const yyyy = today.getFullYear();
  document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;

  function getStatus(job) {
    if (job.done) return 'done';
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const rem = new Date(job.reminderDate);
    const diff = Math.floor((rem - now) / (1000 * 60 * 60 * 24));
    if (diff < 0) return 'overdue';
    if (diff <= 2) return 'soon';
    return 'ok';
  }

  function statusLabel(status) {
    if (status === 'overdue') return 'Verlopen';
    if (status === 'soon') return 'Binnenkort';
    if (status === 'ok') return 'Gepland';
    return 'Klaar';
  }

  function formatDate(d) {
    const date = new Date(d);
    return date.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  async function loadJobs() {
    const res = await fetch('/api/jobs');
    jobs = await res.json();
    render();
    checkAlerts();
    updateStats();
  }

  function render() {
    const list = document.getElementById('jobsList');
    let filtered = jobs;
    if (currentFilter === 'open') filtered = jobs.filter(j => !j.done);
    if (currentFilter === 'done') filtered = jobs.filter(j => j.done);

    // Sort: overdue first, then by date
    filtered.sort((a, b) => {
      if (a.done && !b.done) return 1;
      if (!a.done && b.done) return -1;
      return new Date(a.reminderDate) - new Date(b.reminderDate);
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">Geen jobs gevonden</div>`;
      return;
    }

    list.innerHTML = filtered.map(job => {
      const status = getStatus(job);
      return `
        <div class="job-card ${status}" id="card-${job.id}">
          <div class="job-check ${job.done ? 'checked' : ''}" onclick="toggleDone('${job.id}')">
            <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
              <path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="job-body">
            <div class="job-desc">${escapeHtml(job.description)}</div>
            <div class="job-meta">
              <span class="job-date">${formatDate(job.reminderDate)}</span>
              <span class="badge ${status}">${statusLabel(status)}</span>
            </div>
          </div>
          <div class="job-actions relative">
            <button class="btn-icon" onclick="openSnooze(event, '${job.id}')" title="Uitstellen">↻</button>
            <button class="btn-icon del" onclick="deleteJob('${job.id}')" title="Verwijderen">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function addJob() {
    const desc = document.getElementById('inputDesc').value.trim();
    const date = document.getElementById('inputDate').value;
    if (!desc) { alert('Vul een omschrijving in.'); return; }
    if (!date) { alert('Kies een datum.'); return; }
    await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc, reminderDate: date })
    });
    document.getElementById('inputDesc').value = '';
    loadJobs();
  }

  async function toggleDone(id) {
    const job = jobs.find(j => j.id === id);
    await fetch(`/api/jobs/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: !job.done })
    });
    loadJobs();
  }

  async function deleteJob(id) {
    if (!confirm('Job verwijderen?')) return;
    await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
    loadJobs();
  }

  function openSnooze(e, id) {
    snoozeTargetId = id;
    const menu = document.getElementById('snoozeMenu');
    menu.style.top = (e.target.getBoundingClientRect().bottom + window.scrollY + 4) + 'px';
    menu.style.left = (e.target.getBoundingClientRect().left) + 'px';
    menu.classList.add('show');
    e.stopPropagation();
  }

  async function snooze(days) {
    const job = jobs.find(j => j.id === snoozeTargetId);
    const current = new Date(job.reminderDate);
    current.setDate(current.getDate() + days);
    const newDate = current.toISOString().split('T')[0];
    await fetch(`/api/jobs/${snoozeTargetId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reminderDate: newDate })
    });
    document.getElementById('snoozeMenu').classList.remove('show');
    loadJobs();
  }

  document.addEventListener('click', () => {
    document.getElementById('snoozeMenu').classList.remove('show');
  });

  function checkAlerts() {
    const overdue = jobs.filter(j => !j.done && getStatus(j) === 'overdue');
    const soon = jobs.filter(j => !j.done && getStatus(j) === 'soon');
    const banner = document.getElementById('alertBanner');
    if (overdue.length > 0) {
      banner.innerHTML = `⚠ ${overdue.length} verlopen reminder${overdue.length > 1 ? 's' : ''} — actie vereist. Klik om te bekijken.`;
      banner.classList.add('show');
    } else if (soon.length > 0) {
      banner.innerHTML = `⏰ ${soon.length} reminder${soon.length > 1 ? 's' : ''} vervalt binnenkort. Klik om te bekijken.`;
      banner.classList.add('show');
      banner.style.background = '#e67e22';
    } else {
      banner.classList.remove('show');
    }
  }

  function scrollToOverdue() {
    const first = document.querySelector('.job-card.overdue, .job-card.soon');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function updateStats() {
    const open = jobs.filter(j => !j.done).length;
    const overdue = jobs.filter(j => !j.done && getStatus(j) === 'overdue').length;
    document.getElementById('stats').innerHTML = `
      <div>Open: <span>${open}</span></div>
      <div>Verlopen: <span style="color:${overdue > 0 ? 'var(--overdue)' : 'var(--accent)'}">${overdue}</span></div>
    `;
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === f);
    });
    render();
  }

  // Enter to submit
  document.getElementById('inputDesc').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) addJob();
  });

  loadJobs();
</script>
</body>
</html>
